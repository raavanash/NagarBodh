<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Left Side Lion (Muted Taupe/Brown Silhouette) -->
  <g fill="#93817C">
    <!-- Ear & Head -->
    <path d="M 33 12 C 28 10, 24 14, 25 20 C 22 18, 18 22, 20 28 C 22 34, 26 36, 28 42 C 29 48, 30 56, 32 66 L 38 66 C 36 54, 35 44, 36 34 C 36 26, 35 18, 33 12 Z"/>
    <!-- Paw/Leg background -->
    <rect x="29" y="46" width="6" height="20" rx="3"/>
  </g>

  <!-- Right Side Lion (Muted Taupe/Brown Silhouette) -->
  <g fill="#93817C">
    <!-- Ear & Head -->
    <path d="M 67 12 C 72 10, 76 14, 75 20 C 78 18, 82 22, 80 28 C 78 34, 74 36, 72 42 C 71 48, 70 56, 68 66 L 62 66 C 64 54, 65 44, 64 34 C 64 26, 65 18, 67 12 Z"/>
    <!-- Paw/Leg background -->
    <rect x="65" y="46" width="6" height="20" rx="3"/>
  </g>

  <!-- Center Golden Lion -->
  <!-- Ears -->
  <path d="M 40 12 C 38 5, 46 5, 47 11 Z" fill="#FFCA00"/>
  <path d="M 60 12 C 62 5, 54 5, 53 11 Z" fill="#FFCA00"/>

  <!-- Head Base -->
  <path d="M 42 10 C 46 8, 54 8, 58 10 C 62 14, 61 24, 57 26 C 53 28, 47 28, 43 26 C 39 24, 38 14, 42 10 Z" fill="#FFCA00"/>
  
  <!-- Stylized Glasses/Eyes & Nose (Dark Amber/Brown Accent) -->
  <path d="M 42 16 C 42 13, 48 13, 48 16 C 48 19, 42 19, 42 16 Z" fill="#4A3B32"/>
  <path d="M 52 16 C 52 13, 58 13, 58 16 C 58 19, 52 19, 52 16 Z" fill="#4A3B32"/>
  <path d="M 47 16 L 53 16" stroke="#4A3B32" stroke-width="1.5"/>

  <!-- Tiered Golden Mane -->
  <!-- Layer 1 Top Mane -->
  <path d="M 39 26 C 44 24, 56 24, 61 26 C 64 32, 63 38, 59 40 C 54 38, 46 38, 41 40 C 37 38, 36 32, 39 26 Z" fill="#FFD500"/>
  <!-- Layer 2 Middle Mane -->
  <path d="M 40 34 C 44 32, 56 32, 60 34 C 62 40, 61 46, 58 48 C 53 46, 47 46, 42 48 C 39 46, 38 40, 40 34 Z" fill="#FFC000"/>
  <!-- Layer 3 Lower Chest -->
  <path d="M 41 44 C 45 42, 55 42, 59 44 C 60 50, 58 54, 55 56 C 51 54, 49 54, 45 56 C 42 54, 40 50, 41 44 Z" fill="#FFCA00"/>

  <!-- Front Legs (Paws) -->
  <rect x="42" y="48" width="6" height="20" rx="3" fill="#FFCA00"/>
  <rect x="52" y="48" width="6" height="20" rx="3" fill="#FFCA00"/>

  <!-- Base Pedestal (Abacus) -->
  <!-- Top Lip -->
  <rect x="24" y="66" width="52" height="5" rx="1.5" fill="#FFE040"/>
  <!-- Pedestal Box -->
  <rect x="25" y="70" width="50" height="18" rx="2" fill="#FFCA00"/>
  <!-- Bottom Lip -->
  <rect x="22" y="87" width="56" height="5" rx="1.5" fill="#FFE040"/>

  <!-- Ashoka Chakra Emblem in Center of Pedestal -->
  <circle cx="50" cy="79" r="6" fill="#E67E22"/>
  <circle cx="50" cy="79" r="4.5" fill="#D35400"/>
  <circle cx="50" cy="79" r="1.5" fill="#FFCA00"/>
</svg>