<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Top Saffron Band -->
    <rect x="0" y="0" width="100" height="33.333" fill="#FF9933"/>
    <!-- Middle White Band -->
    <rect x="0" y="33.333" width="100" height="33.334" fill="#FFFFFF"/>
    <!-- Bottom Green Band -->
    <rect x="0" y="66.667" width="100" height="33.333" fill="#138808"/>

    <!-- Ashoka Chakra -->
    <!-- Outer Ring -->
    <circle cx="50" cy="50" r="9.5" stroke="#000080" stroke-width="1.3" fill="none"/>
    <!-- Inner Hub -->
    <circle cx="50" cy="50" r="1.8" fill="#000080"/>
    <!-- 24 Spokes -->
    <g stroke="#000080" stroke-width="0.75">
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(0 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(15 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(30 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(45 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(60 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(75 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(90 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(105 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(120 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(135 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(150 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(165 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(180 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(195 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(210 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(225 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(240 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(255 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(270 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(285 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(300 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(315 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(330 50 50)"/>
      <line x1="50" y1="50" x2="50" y2="40.8" transform="rotate(345 50 50)"/>
